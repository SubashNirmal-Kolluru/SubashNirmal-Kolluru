<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29b5e8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#29b5e8"/>
      <stop offset="75%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid dots -->
  <g fill="#334155" opacity="0.15">
    <rect x="80" y="60" width="3" height="3" rx="1.5"/>
    <rect x="200" y="60" width="3" height="3" rx="1.5"/>
    <rect x="1000" y="60" width="3" height="3" rx="1.5"/>
    <rect x="1120" y="60" width="3" height="3" rx="1.5"/>
    <rect x="80" y="570" width="3" height="3" rx="1.5"/>
    <rect x="200" y="570" width="3" height="3" rx="1.5"/>
    <rect x="1000" y="570" width="3" height="3" rx="1.5"/>
    <rect x="1120" y="570" width="3" height="3" rx="1.5"/>
  </g>

  <!-- Pipeline strip at bottom -->
  <g fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4">
    <rect x="100" y="520" width="80" height="44" rx="8"/>
    <rect x="240" y="520" width="80" height="44" rx="8"/>
    <rect x="380" y="520" width="80" height="44" rx="8"/>
    <rect x="520" y="520" width="80" height="44" rx="8"/>
    <rect x="660" y="520" width="80" height="44" rx="8"/>
    <rect x="800" y="520" width="80" height="44" rx="8"/>
    <rect x="940" y="520" width="80" height="44" rx="8"/>
    <rect x="1040" y="520" width="80" height="44" rx="8"/>
  </g>
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4" stroke-dasharray="5 4">
    <line x1="180" y1="542" x2="240" y2="542"/>
    <line x1="320" y1="542" x2="380" y2="542"/>
    <line x1="460" y1="542" x2="520" y2="542"/>
    <line x1="600" y1="542" x2="660" y2="542"/>
    <line x1="740" y1="542" x2="800" y2="542"/>
    <line x1="880" y1="542" x2="940" y2="542"/>
    <line x1="1020" y1="542" x2="1040" y2="542"/>
  </g>
  <g font-family="'SF Mono', monospace" font-size="11" fill="#64748b" text-anchor="middle">
    <text x="140" y="546">Sources</text>
    <text x="280" y="546">Glue</text>
    <text x="420" y="546">EMR</text>
    <text x="560" y="546">S3 Lake</text>
    <text x="700" y="546">Snowflake</text>
    <text x="840" y="546">dbt</text>
    <text x="980" y="546">Analytics</text>
    <text x="1080" y="546">BI</text>
  </g>

  <!-- Accent line -->
  <line x1="300" y1="390" x2="900" y2="390" stroke="url(#accent)" stroke-width="2" opacity="0.9"/>

  <!-- Name -->
  <text x="600" y="240"
    text-anchor="middle"
    font-family="Inter, -apple-system, sans-serif"
    font-size="72"
    font-weight="700"
    fill="#f1f5f9"
    letter-spacing="-2">
    Subash Nirmal Kolluru
  </text>

  <!-- Title -->
  <text x="600" y="305"
    text-anchor="middle"
    font-family="Inter, -apple-system, sans-serif"
    font-size="26"
    font-weight="500"
    fill="#7dd3fc">
    Data Engineer  ·  AWS  ·  Snowflake  ·  PySpark
  </text>

  <!-- Company -->
  <text x="600" y="355"
    text-anchor="middle"
    font-family="Inter, -apple-system, sans-serif"
    font-size="18"
    font-weight="400"
    fill="#64748b">
    Software Engineer 2 @ CSAA Insurance Group
  </text>
</svg>
